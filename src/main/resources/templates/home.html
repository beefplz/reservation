<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회의실 예약</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        button { padding: 6px 12px; }
    </style>
</head>
<body>
<h1>회의실 예약</h1>

<p><strong th:text="${loginMember.name}">홍길동</strong>님 환영합니다.
    <span th:if="${loginMember.role.name() == 'ADMIN'}">(관리자)</span></p>

<!-- 로그아웃은 POST + CSRF 토큰. GET 링크로 하면 다른 사이트가 몰래 로그아웃시킬 수 있다 -->
<form th:action="@{/logout}" method="post">
    <button type="submit">로그아웃</button>
</form>
</body>
</html>
