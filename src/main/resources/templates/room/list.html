<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회의실 목록 - 회의실 예약</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
<h1>회의실 목록</h1>

<table>
    <thead>
    <tr><th>이름</th><th>위치</th><th>수용 인원</th></tr>
    </thead>
    <tbody>
    <tr th:each="room : ${rooms}">
        <td th:text="${room.name}">회의실 A</td>
        <td th:text="${room.location}">본관 3층</td>
        <td th:text="|${room.capacity}명|">6명</td>
    </tr>
    <tr th:if="${#lists.isEmpty(rooms)}">
        <td colspan="3">이용할 수 있는 회의실이 없습니다.</td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/}">처음으로</a></p>
</body>
</html>
