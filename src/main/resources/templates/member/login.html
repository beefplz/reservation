<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 회의실 예약</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; padding: 6px; box-sizing: border-box; }
        .error { color: #c00; }
        .info { color: #060; }
        button { margin-top: 16px; padding: 8px 16px; }
    </style>
</head>
<body>
<h1>로그인</h1>

<!-- signupSuccess: 회원가입 직후 flash 속성 / param.error, param.logout: Security 가 붙여주는 쿼리 -->
<p class="info" th:if="${signupSuccess}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
<p class="info" th:if="${param.logout}">로그아웃되었습니다.</p>
<!-- 아이디가 없는지, 비밀번호가 틀렸는지 구분하지 않는다 (가입된 아이디 노출 방지) -->
<p class="error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>

<!-- th:action 을 쓰면 CSRF 토큰 hidden input 이 자동으로 들어간다 -->
<form th:action="@{/login}" method="post">
    <label for="loginId">아이디</label>
    <input type="text" id="loginId" name="loginId" autofocus>

    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password">

    <button type="submit">로그인</button>
</form>

<p>계정이 없나요? <a th:href="@{/signup}">회원가입</a></p>
</body>
</html>
